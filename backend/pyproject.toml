[project]
name = "exam-engine-api"
version = "0.1.0"
description = "Evidence-grounded exam preparation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "reportlab>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
