services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: exam_engine
      POSTGRES_USER: exam_engine
      POSTGRES_PASSWORD: exam_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_engine -d exam_engine"]
      interval: 5s
      timeout: 3s
      retries: 12
    # 仅绑定本机回环地址，供开发期 API 连接；不要改为 0.0.0.0。
    ports:
      - "127.0.0.1:5432:5432"
volumes:
  postgres_data:
